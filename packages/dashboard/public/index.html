<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Agent Console</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<header>
  <div class="head-main">
    <div class="brand"><h1>Agent Console</h1></div>
    <div id="project-bar" class="project-bar"></div>
    <span id="project-count"></span>
    <div id="summary" aria-live="polite"></div>
    <span id="connection" class="connection" role="status">Connecting</span>
    <span id="updated"></span>
  </div>
  <div class="head-sub" id="head-sub" hidden>
    <div class="legend" aria-label="Legend">
      <span><i class="lg-planned"></i>Planned</span>
      <span><i class="lg-running"></i>Running</span>
      <span><i class="lg-waiting"></i>Waiting</span>
      <span><i class="lg-done"></i>Done</span>
      <span><i class="lg-failed"></i>Failed</span>
      <span><i class="lg-ended"></i>Lost</span>
    </div>
    <div id="usage" aria-label="Usage"></div>
  </div>
</header>
<main>
  <div id="canvas"><p class="empty">Connecting…</p></div>
  <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Panel width" tabindex="0"></div>
  <aside id="detail"><p class="empty">Select a node</p></aside>
</main>
<div id="toasts" aria-live="polite"></div>
</body>
</html>

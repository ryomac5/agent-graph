<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-graph</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header>
    <div><span class="eyebrow">AGENT GRAPH</span><h1>委譲グラフ</h1></div>
    <div class="controls"><label for="repo">リポジトリ</label><select id="repo"><option value="">読み込み中…</option></select><span id="connection" role="status">接続中</span></div>
  </header>
  <main>
    <section class="graph-panel" aria-label="委譲グラフ">
      <div class="panel-heading"><h2>セッションと委譲</h2><span id="count"></span></div>
      <div class="legend"><span><i class="anthropic"></i>Claude / Anthropic</span><span><i class="openai"></i>Codex / OpenAI</span><span><i class="other"></i>その他</span></div>
      <div class="graph-scroll"><svg id="graph" role="img" aria-label="委譲の有向グラフ"></svg><p id="empty">リポジトリを選択してください。</p></div>
    </section>
    <aside class="detail-panel"><h2>委譲の詳細</h2><div id="details"><p class="hint">ノードを選択すると詳細を表示します。</p></div></aside>
  </main>
</body>
</html>
